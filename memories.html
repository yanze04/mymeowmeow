<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #1a1015;
    --blush: #0d0709;
    --plum: #ff5c8d;
    --rose: #ff8fb3;
    --gold: #ff2e63;
    --paper: #201319;
  }

  * { box-sizing: border-box; }

  /* Simple top navigation */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: flex-start;
    gap: 12px;
    padding: 12px 16px;
    z-index: 999;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(8px);
  }

  .navbar a {
    color: var(--plum);
    text-decoration: none;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    transition: 0.25s ease;
  }

  .navbar a:hover { transform: translateY(-2px); background: rgba(255,255,255,0.05); }

  body {
    margin: 0;
    background: linear-gradient(180deg, var(--cream) 0%, var(--blush) 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--plum);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Floating hearts background */
  .heart {
    position: fixed;
    top: -10%;
    font-size: 20px;
    color: var(--rose);
    opacity: 0.35;
    pointer-events: none;
    animation: floatUp linear infinite;
    z-index: 0;
  }

  @keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); }
    to { transform: translateY(-120vh) rotate(360deg); }
  }

  header {
    text-align: center;
    padding: 60px 20px 30px;
    position: relative;
    z-index: 1;
  }

  header h1 {
    font-family: 'Caveat', cursive;
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    color: var(--plum);
    margin: 0;
    line-height: 1;
  }

  header p {
    font-size: 1rem;
    color: var(--rose);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .album {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 30px 100px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px 30px;
    position: relative;
    z-index: 1;
  }

  .polaroid {
    background: var(--paper);
    padding: 14px 14px 46px;
    box-shadow: 0 8px 20px rgba(255, 46, 99, 0.25);
    width: 240px;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
  }

  .polaroid:nth-child(odd)  { transform: rotate(-4deg); }
  .polaroid:nth-child(even) { transform: rotate(3deg); }
  .polaroid:nth-child(3n)   { transform: rotate(-2deg); }

  .polaroid:hover {
    transform: scale(1.06) rotate(0deg) !important;
    box-shadow: 0 14px 30px rgba(255, 46, 99, 0.4);
    z-index: 5;
  }

  .polaroid img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
    background: var(--blush);
  }

  .tape {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%) rotate(-2deg);
    width: 70px;
    height: 24px;
    background: rgba(212, 165, 116, 0.55);
    border: 1px solid rgba(212, 165, 116, 0.7);
  }

  .caption {
    font-family: 'Caveat', cursive;
    font-size: 1.4rem;
    text-align: center;
    margin-top: 10px;
    color: var(--plum);
  }

  .date {
    font-family: 'Quicksand', sans-serif;
    font-size: 0.7rem;
    text-align: center;
    color: var(--rose);
    letter-spacing: 0.05em;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }

  .lightbox.active { display: flex; }

  .lightbox img {
    max-width: min(90vw, 600px);
    max-height: 65vh;
    object-fit: contain;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  .lightbox-caption {
    font-family: 'Caveat', cursive;
    font-size: 2rem;
    color: var(--cream);
    margin-top: 20px;
    text-align: center;
    max-width: 500px;
  }

  .close-btn {
    position: absolute;
    top: 24px;
    right: 32px;
    font-size: 2rem;
    color: var(--cream);
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
  }

  footer {
    text-align: center;
    padding-bottom: 50px;
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    color: var(--rose);
    position: relative;
    z-index: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none; display: none; }
  }
</style>
</head>
<body>

<div class="navbar">
  <a href="1st.html">HOME</a>
</div>

<header>
  <h1>HAPPY MONTHSARRY MY YONA, LOVE, BABY</h1>
  <p>a small album of us</p>
</header>

<div class="album" id="album"></div>



<div class="lightbox" id="lightbox">
  <button class="close-btn" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<script>

  const memories = [
    { src: "photo1.jpg", caption: "Tulog tulugan sa tent", date: "8/5/2026" },
    { src: "photo2.jpg", caption: "our little moon moment", date: "3/25/2026" },
    { src: "photo3.png", caption: "grinding evomon hehehe", date: "8/10/2026" },
    { src: "photo4.png", caption: "fireflies and swings", date: "7/18/2026" },
  ];

  const album = document.getElementById('album');

  memories.forEach((mem) => {
    const card = document.createElement('div');
    card.className = 'polaroid';
    card.innerHTML = `
      <div class="tape"></div>
      <img src="${mem.src}" alt="${mem.caption}"
           onerror="this.src='https://placehold.co/240x240/1a1015/ff5c8d?text=add+photo'">
      <div class="caption">${mem.caption}</div>
      <div class="date">${mem.date}</div>
    `;
    card.addEventListener('click', () => openLightbox(mem));
    album.appendChild(card);
  });

  function openLightbox(mem) {
    document.getElementById('lightbox-img').src = mem.src;
    document.getElementById('lightbox-caption').textContent = mem.caption;
    document.getElementById('lightbox').classList.add('active');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }

  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });

  // Floating hearts
  const heartsContainer = document.body;
  const heartSymbols = ['💕', '🤍', '✨'];
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (10 + Math.random() * 10) + 's';
    heart.style.animationDelay = (Math.random() * 10) + 's';
    heart.style.fontSize = (14 + Math.random() * 14) + 'px';
    heartsContainer.appendChild(heart);
  }
</script>

</body>
</html>
